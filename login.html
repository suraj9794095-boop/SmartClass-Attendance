<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Login - SmartClass</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #2563eb;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">
            SmartClass
        </div>

        <p class="subtitle">
            Teacher Attendance Management System
        </p>

        <label for="username">
            Teacher Username
        </label>

        <input
            type="text"
            id="username"
            placeholder="Enter username"
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >

        <button class="login-btn" onclick="login()">
            Login
        </button>
<div style="text-align:center; margin-top:15px;">
    <button
        onclick="forgotPassword()"
        style="border:none; background:none; color:#2563eb; cursor:pointer; font-weight:bold;"
    >
        Forgot Password?
    </button>
</div>
        <p id="message" class="message"></p>

    </div>

    <script>

        function login() {

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value.trim();

            const message =
                document.getElementById("message");

            const savedPassword =
    localStorage.getItem("teacherPassword") || "1234";

if (username === "teacher" && password === savedPassword) {

                message.textContent =
                    "✅ Login successful!";
                    localStorage.setItem("teacherLoggedIn", "true");

                message.style.color = "#16a34a";

                setTimeout(function() {
                    window.location.href = "index.html";
                }, 700);

            } else {

                message.textContent =
                    "❌ Invalid username or password.";

                message.style.color = "#dc2626";
            }
        }
function forgotPassword() {
    const username = prompt("Enter your teacher username:");

    if (username === null) {
        return;
    }

    if (username.trim() === "teacher") {
        const otp = Math.floor(1000 + Math.random() * 9000);

        alert("Demo OTP: " + otp);

        const enteredOTP = prompt("Enter the OTP:");

        if (enteredOTP === String(otp)) {
            const newPassword = prompt("Enter your new password:");

            if (newPassword && newPassword.trim() !== "") {
                localStorage.setItem("teacherPassword", newPassword.trim());
                alert("✅ Password changed successfully!");
            } else {
                alert("❌ Password cannot be empty.");
            }
        } else {
            alert("❌ Incorrect OTP.");
        }

    } else {
        alert("❌ Username not found.");
    }
}
    </script>

</body>
</html>
